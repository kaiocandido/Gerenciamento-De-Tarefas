<div class="add-task-form">
  <mat-form-field appearance="fill">
    <mat-label>Nova Tarefa</mat-label>
    <input #taskInput matInput [(ngModel)]="newTaskTile" (keyup.enter)="addTask()" placeholder="Oque precisa ser feito?">
  </mat-form-field>
  <mat-form-field appearance="fill" >
    <mat-label>Prioridade</mat-label>
    <mat-select [(ngmodel)]="newTaskPriority">
      @for(priority of priorities; track priority){
        <mat-option [value]="priority">{{priority}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="addTask()" [disabled]="!newTaskTile()" >
    <mat-icon>add</mat-icon>
    Adicionar
  </button>
</div>

<div class="list-container">
 @for(task of getAllTasks(); track task.id){
  <app-task-item
    [task]="task"
    (toogle)="toggleTaskStatus(task.id)"
    (delete)="deleteTask(task.id)"
  />
 } @empty {
  <div class="empty-state">
    <mat-icon>task_alt</mat-icon>
    <p>Nenhuma tarefa encontrada!</p>
  </div>
 }
</div>
